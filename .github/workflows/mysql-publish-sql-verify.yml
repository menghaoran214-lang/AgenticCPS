name: MySQL 投放任务 SQL 校验

on:
  pull_request:
    paths:
      - 'backend/sql/**'
      - '.github/workflows/mysql-publish-sql-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cps_publish_sql_check
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: 准备最小依赖表
        run: |
          mysql -h127.0.0.1 -uroot -proot cps_publish_sql_check <<'SQL'
          CREATE TABLE `system_menu` (
            `id` bigint NOT NULL AUTO_INCREMENT,
            `name` varchar(64) NOT NULL DEFAULT '',
            `permission` varchar(128) NOT NULL DEFAULT '',
            `type` tinyint NOT NULL DEFAULT 0,
            `sort` int NOT NULL DEFAULT 0,
            `parent_id` bigint NOT NULL DEFAULT 0,
            `path` varchar(255) NOT NULL DEFAULT '',
            `icon` varchar(255) NOT NULL DEFAULT '',
            `component` varchar(255) NOT NULL DEFAULT '',
            `component_name` varchar(255) NOT NULL DEFAULT '',
            `status` tinyint NOT NULL DEFAULT 0,
            `visible` bit(1) NOT NULL DEFAULT b'1',
            `keep_alive` bit(1) NOT NULL DEFAULT b'1',
            `always_show` bit(1) NOT NULL DEFAULT b'1',
            `creator` varchar(64) DEFAULT '',
            `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `updater` varchar(64) DEFAULT '',
            `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            `deleted` bit(1) NOT NULL DEFAULT b'0',
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE `system_role_menu` (
            `id` bigint NOT NULL AUTO_INCREMENT,
            `role_id` bigint NOT NULL,
            `menu_id` bigint NOT NULL,
            `creator` varchar(64) DEFAULT '',
            `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `updater` varchar(64) DEFAULT '',
            `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            `deleted` bit(1) NOT NULL DEFAULT b'0',
            `tenant_id` bigint NOT NULL DEFAULT 0,
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE `infra_job` (
            `id` bigint NOT NULL AUTO_INCREMENT,
            `name` varchar(32) NOT NULL,
            `status` tinyint NOT NULL,
            `handler_name` varchar(64) NOT NULL,
            `handler_param` varchar(255) DEFAULT NULL,
            `cron_expression` varchar(32) NOT NULL,
            `retry_count` int NOT NULL DEFAULT 0,
            `retry_interval` int NOT NULL DEFAULT 0,
            `monitor_timeout` int NOT NULL DEFAULT 0,
            `creator` varchar(64) DEFAULT '',
            `create_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `updater` varchar(64) DEFAULT '',
            `update_time` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            `deleted` bit(1) NOT NULL DEFAULT b'0',
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

          CREATE TABLE `system_schema_version` (
            `id` bigint NOT NULL AUTO_INCREMENT,
            `module` varchar(64) NOT NULL,
            `version` varchar(32) NOT NULL,
            `schema_update_time` datetime NOT NULL,
            `script_source` varchar(128) DEFAULT '',
            `description` varchar(512) DEFAULT '',
            `status` varchar(32) DEFAULT '',
            `tenant_id` bigint NOT NULL DEFAULT 0,
            `deleted` bit(1) NOT NULL DEFAULT b'0',
            `creator` varchar(64) DEFAULT '',
            `updater` varchar(64) DEFAULT '',
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          SQL

      - name: 在隔离库中复现旧投放迁移的乱码
        run: |
          set -euo pipefail
          awk '/^-- 修改时间：2026-11-04 00:50:00/ {publish=1} /^-- 修改时间：2026-11-25 02:09:54/ {publish=0} publish' backend/sql/module/cps-update.sql > /tmp/publish_migration.sql
          awk '/^-- 修改时间：2026-11-25 02:09:54/ {repair=1} repair' backend/sql/module/cps-update.sql > /tmp/publish_repair.sql
          test -s /tmp/publish_migration.sql
          test -s /tmp/publish_repair.sql
          mysql -h127.0.0.1 -uroot -proot --default-character-set=latin1 cps_publish_sql_check < /tmp/publish_migration.sql
          q() { mysql -N -B -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 cps_publish_sql_check -e "$1"; }
          test "$(q "SELECT COUNT(*) FROM system_menu WHERE id=6310 AND BINARY name <> '投放任务'")" = 1
          test "$(q "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='cps_publish_sql_check' AND TABLE_NAME='cps_publish_task' AND BINARY TABLE_COMMENT <> 'CPS投放任务表'")" = 1
          echo PUBLISH_SQL_LEGACY_ENCODING_REPRODUCED=PASS

      - name: 修复中文并验证可重复执行
        run: |
          set -euo pipefail
          q() { mysql -N -B -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 cps_publish_sql_check -e "$1"; }
          apply_sql() { mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 cps_publish_sql_check < "$1"; }
          for attempt in 1 2; do
            apply_sql /tmp/publish_repair.sql
            test "$(q "SELECT CONCAT_WS('|', (SELECT GROUP_CONCAT(name ORDER BY id SEPARATOR '|') FROM system_menu WHERE id BETWEEN 6310 AND 6317), (SELECT name FROM infra_job WHERE handler_name='cpsPublishDispatchJob'))")" = '投放任务|投放任务查询|投放任务创建|投放任务更新|投放任务删除|投放任务上线|投放任务下线|投放任务立即执行|CPS投放任务调度'
            test "$(q "SELECT TABLE_COMMENT FROM information_schema.TABLES WHERE TABLE_SCHEMA='cps_publish_sql_check' AND TABLE_NAME='cps_publish_task'")" = 'CPS投放任务表'
            test "$(q "SELECT TABLE_COMMENT FROM information_schema.TABLES WHERE TABLE_SCHEMA='cps_publish_sql_check' AND TABLE_NAME='cps_publish_log'")" = 'CPS投放记录表'
            test "$(q "SELECT COLUMN_COMMENT FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='cps_publish_sql_check' AND TABLE_NAME='cps_publish_task' AND COLUMN_NAME='task_name'")" = '投放任务名称'
            test "$(q "SELECT COLUMN_COMMENT FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='cps_publish_sql_check' AND TABLE_NAME='cps_publish_log' AND COLUMN_NAME='content_snapshot'")" = '实际发送内容快照'
            test "$(q "SELECT description FROM system_schema_version WHERE module='cps' AND version='v2.1.7'")" = '新增CPS投放任务模块(cps_publish_task/cps_publish_log)、投放调度定时任务与后台菜单权限'
            test "$(q "SELECT description FROM system_schema_version WHERE module='cps' AND version='v2.1.8' AND status='SUCCESS'")" = '修复投放任务菜单、调度名称和数据库注释的中文乱码'
            test "$(q "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='cps_publish_sql_check' AND table_name='cps_publish_log' AND index_name='uk_idempotent_key' AND non_unique=0")" = 3
            echo "PUBLISH_SQL_UTF8_ASSERTIONS_$attempt=PASS"
          done
          apply_sql /tmp/publish_migration.sql
          test "$(q "SELECT COUNT(*) FROM system_menu WHERE id BETWEEN 6310 AND 6317")" = 8
          test "$(q "SELECT COUNT(*) FROM infra_job WHERE handler_name='cpsPublishDispatchJob'")" = 1
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='cps_publish_sql_check' AND table_name='cps_publish_task'")" = 1
          echo PUBLISH_SQL_RERUN_ASSERTIONS=PASS
