name: CPS Promotion + Pay MySQL 8 Schema Probe (isolated)

on:
  push:
    branches: [develop]
    paths:
      - backend/sql/migrations/V20261028_04__promotion_core_mysql8.sql
      - backend/sql/migrations/V20261028_05__pay_core_mysql8.sql
      - script/ci/cps_promotion_pay_schema_probe.py
      - .github/workflows/cps-promotion-pay-schema-probe.yml
      - backend/qiji-module-pay/src/main/java/**
      - backend/qiji-module-mall/qiji-module-promotion/src/main/java/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-schema-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-isolated-db-2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-isolated-db-2026"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GITHUB_ACTIONS: "true"
      CPS_37_SCHEMA_ISOLATED: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_ROOT_PASSWORD: test-only-isolated-db-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test MySQL client
        run: python -m pip install "PyMySQL==1.1.2"
      - name: Validate all 37 entity tables plus payment idempotency indexes
        run: python script/ci/cps_promotion_pay_schema_probe.py
      - name: Store CI-only schema checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-promotion-pay-schema-safety-report
          path: promotion-pay-schema-report.json
          retention-days: 7
          if-no-files-found: warn
