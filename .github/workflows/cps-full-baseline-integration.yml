name: CPS Full Baseline + Five Modules (isolated)

on:
  push:
    branches: [develop]
    paths:
      - backend/sql/mysql/ruoyi-vue-pro.sql
      - backend/sql/mysql/quartz.sql
      - backend/sql/module/cps-all-in-one.sql
      - backend/sql/migrations/V20261028_01__member_core_mysql8.sql
      - backend/sql/migrations/V20261028_02__product_core_mysql8.sql
      - backend/sql/migrations/V20261028_03__trade_core_mysql8.sql
      - backend/sql/migrations/V20261028_04__promotion_core_mysql8.sql
      - backend/sql/migrations/V20261028_05__pay_core_mysql8.sql
      - script/ci/cps_full_baseline_integration.py
      - .github/workflows/cps-full-baseline-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-github-runner-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-github-runner-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      GITHUB_ACTIONS: "true"
      CPS_FULL_BASELINE_CI: "1"
      MYSQL_HOST: "127.0.0.1"
      MYSQL_ROOT_PASSWORD: local-github-runner-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned isolated MySQL client
        run: python -m pip install "PyMySQL==1.1.2"
      - name: Recreate CPS baseline and all five module migrations
        run: python script/ci/cps_full_baseline_integration.py
      - name: Store CI-only schema verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-full-baseline-and-five-module-check
          path: full-baseline-migration-ci-report.json
          retention-days: 7
          if-no-files-found: warn
