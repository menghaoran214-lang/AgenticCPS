name: AgenticCPS Safety Tests

on:
  push:
    branches: [develop]
    paths: ['backend/**', 'script/ci/**', '.github/workflows/cps-safety-tests.yml']
  pull_request:
    branches: [master, develop]
    paths: ['backend/**', 'script/ci/**', '.github/workflows/cps-safety-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cps-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Login, funds and order rebate regression (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAVEN_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m"
      CPS_SAFETY_TESTS: AdminAuthServiceImplTest,MemberAuthLoginSafetyTest,CpsAppMemberContextTest,AppCpsOrderControllerTest,AppCpsRebateControllerTest,AppCpsWithdrawControllerTest,CpsOrderServiceImplTest,CpsOrderClaimServiceImplTest,CpsRebateRecordServiceImplTest,CpsRebateSettleServiceImplTest,CpsRebateSettleMultiLevelTest,CpsMoneyConverterTest,CpsRebateAssetServiceImplTest,CpsRebateAssetLedgerConcurrencyTest,CpsRebateRoleMapperTest,CpsRebateTokenExchangeServiceImplTest,CpsWithdrawSecurityServiceTest,CpsWithdrawAccountServiceTest,CpsMcpAuthorizationServiceTest,CpsWithdrawServiceImplTest,CpsWithdrawStepExecutorTest,CpsWithdrawTransferExecutorTest,CpsRebateAssetPolicyServiceImplTest,CpsOrderSyncBatchServiceImplTest,CpsOrderSyncPageServiceImplTest,CpsPromoterRelationServiceTest,CpsPromoterBindingMapperTest,CpsSplitCalculatorTest,AppCpsPromoterControllerTest,CpsAdminPromoterControllerTest,CpsSplitRuleControllerTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify report gate itself
        run: python3 -m unittest discover -s script/ci -p test_verify_safety_reports.py -v
      - name: Run safety regression using in-memory test databases and mocks
        run: >-
          mvn -B -ntp -f backend/pom.xml test
          -pl qiji-module-cps/qiji-module-cps-biz -am
          "-Dtest=$CPS_SAFETY_TESTS"
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require every selected suite to execute passing tests
        run: python3 script/ci/verify_safety_reports.py backend "$CPS_SAFETY_TESTS"
      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenticcps-safety-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
