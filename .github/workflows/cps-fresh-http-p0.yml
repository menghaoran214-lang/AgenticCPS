name: CPS P0 Fresh Build HTTP Auth and Rebate Journey (isolated)

on:
  pull_request:
    branches: [develop]
    paths:
      - backend/**
      - script/ci/station_*
      - script/ci/cps_fresh_http_auth_probe.py
      - script/ci/compose.station.json
      - .github/workflows/cps-fresh-http-p0.yml
  push:
    branches: [develop]
    paths:
      - backend/**
      - script/ci/station_*
      - script/ci/cps_fresh_http_auth_probe.py
      - script/ci/compose.station.json
      - .github/workflows/cps-fresh-http-p0.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cps-p0-fresh-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-auth-rebate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CPS_STATION_ISOLATED: '1'
      CPS_STATION_PROFILE: ci
      COMPOSE_PROJECT_NAME: cps-station-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MAVEN_OPTS: '-Xmx3g -XX:MaxMetaspaceSize=768m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require GitHub-hosted disposable runner and isolated test profile
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$CPS_STATION_PROFILE" = ci
          case "$COMPOSE_PROJECT_NAME" in cps-station-ci-*) ;; *) exit 1 ;; esac
          python -m unittest discover -s script/ci -p 'test_station_*.py' -v
          python -m py_compile script/ci/station_journey.py script/ci/cps_fresh_http_auth_probe.py
      - name: Compile a fresh server JAR from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f backend/pom.xml clean package -pl qiji-server -am -DskipTests
          test -s backend/qiji-server/target/qiji-server.jar
      - name: Install isolated HTTP dependencies
        run: |
          python -m pip install 'pymysql[rsa]==1.1.2' 'bcrypt==4.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends socat
      - name: Prepare disposable credentials, SQL fixture and checked-out JAR
        shell: bash
        run: |
          set -euo pipefail
          python script/ci/station_journey.py init
          cp backend/qiji-server/target/qiji-server.jar .station-ci/server/qiji-server.jar
          printf '<!doctype html><title>CI internal HTTP proxy only</title>\n' > .station-ci/admin/index.html
          printf '<!doctype html><title>CI no browser tests</title>\n' > .station-ci/h5/index.html
          sha256sum .station-ci/server/qiji-server.jar | awk '{print $1}' > .station-ci/evidence/server-jar-sha256.txt
          git rev-parse HEAD > .station-ci/evidence/checked-out-commit.txt
      - name: Start loopback-only MySQL Redis and Java HTTP
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .station-ci/runtime.env
          set +a
          compose() { docker compose --project-directory "$PWD" --env-file .station-ci/runtime.env -f .station-ci/compose.json "$@"; }
          compose config --quiet
          compose pull
          compose up -d --wait qiji-mysql qiji-redis
          start_proxy() {
            local name="$1" local_port="$2" internal_port="$3" address
            address="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(compose ps -q "$name")")"
            test -n "$address"
            nohup socat "TCP-LISTEN:$local_port,bind=127.0.0.1,reuseaddr,fork" "TCP:$address:$internal_port" > ".station-ci/$name-proxy.log" 2>&1 &
            echo "$!" >> .station-ci/proxy.pids
          }
          start_proxy qiji-mysql "$CPS_STATION_SQL_PORT" 3306
          sleep 1
          python script/ci/station_journey.py prepare
          compose up -d qiji-server admin
          start_proxy qiji-server "$CPS_STATION_SERVER_PORT" 48080
          start_proxy admin "$CPS_STATION_WEB_PORT" 80
          for attempt in $(seq 1 100); do
            if curl -fsS --max-time 3 "http://127.0.0.1:$CPS_STATION_SERVER_PORT/actuator/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo 'Fresh-build application did not become healthy'
          exit 1
      - name: P0 real HTTP login authorization and revocation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .station-ci/runtime.env
          set +a
          python script/ci/cps_fresh_http_auth_probe.py
      - name: P0 real HTTP synthetic order / commission / refund journey
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .station-ci/runtime.env
          set +a
          python script/ci/station_journey.py exercise
      - name: Record resource limits and ensure zero OOM or container restarts
        if: always() && steps.runtime.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .station-ci/runtime.env
          set +a
          python script/ci/station_resources.py
      - name: Upload aggregate and synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-p0-fresh-http-evidence
          path: .station-ci/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only this workflow's disposable containers and volumes
        if: always()
        shell: bash
        run: |
          if test -f .station-ci/proxy.pids; then
            while read -r pid; do kill "$pid" 2>/dev/null || true; done < .station-ci/proxy.pids
          fi
          if test -f .station-ci/runtime.env && test -f .station-ci/compose.json; then
            docker compose --project-directory "$PWD" --env-file .station-ci/runtime.env -f .station-ci/compose.json down -v --remove-orphans
          fi
