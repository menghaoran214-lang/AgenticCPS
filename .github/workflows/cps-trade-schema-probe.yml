name: CPS Trade MySQL 8 Migration Probe (isolated)

on:
  push:
    branches: [develop]
    paths:
      - backend/sql/migrations/V20261028_03__trade_core_mysql8.sql
      - script/ci/cps_trade_schema_probe.py
      - .github/workflows/cps-trade-schema-probe.yml
      - backend/qiji-module-mall/qiji-module-trade/src/main/java/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trade-schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: only-ci-not-business-database
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ponly-ci-not-business-database"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GITHUB_ACTIONS: "true"
      CPS_TRADE_SCHEMA_ISOLATED: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_ROOT_PASSWORD: only-ci-not-business-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated MySQL connector
        run: python -m pip install "PyMySQL==1.1.2"
      - name: Check all 15 Java trade models with MySQL schema
        run: python script/ci/cps_trade_schema_probe.py
      - name: Upload non-production schema report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-trade-schema-ci-report
          path: trade-schema-ci-report.json
          retention-days: 7
          if-no-files-found: warn
