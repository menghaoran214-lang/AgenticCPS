name: CPS Member MySQL 8 Migration Probe (isolated)

on:
  push:
    branches: [develop]
    paths:
      - backend/sql/migrations/V20261028_01__member_core_mysql8.sql
      - script/ci/cps_member_schema_probe.py
      - .github/workflows/cps-member-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member-schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-no-business-data
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-no-business-data"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GITHUB_ACTIONS: "true"
      CPS_MEMBER_SCHEMA_ISOLATED: "1"
      MYSQL_HOST: "127.0.0.1"
      MYSQL_ROOT_PASSWORD: ci-only-no-business-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated SQL test dependency
        run: python -m pip install "PyMySQL==1.1.2"
      - name: Verify schema and tenant uniqueness without touching production
        run: python script/ci/cps_member_schema_probe.py
      - name: Archive CI-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-member-schema-probe
          path: member-schema-ci-report.json
          retention-days: 7
          if-no-files-found: warn
