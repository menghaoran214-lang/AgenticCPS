name: AgenticCPS Build Check

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/admin-vue3/**'
      - '.github/workflows/cps-build-check.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - 'frontend/admin-vue3/**'
      - '.github/workflows/cps-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build Java server (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test login, funds safety and order rebates
        run: >-
          mvn -B -ntp -f backend/pom.xml test
          -pl qiji-module-cps/qiji-module-cps-biz -am
          -Dtest=AdminAuthServiceImplTest,MemberAuthLoginSafetyTest,CpsAppMemberContextTest,AppCpsOrderControllerTest,AppCpsRebateControllerTest,AppCpsWithdrawControllerTest,CpsOrderServiceImplTest,CpsOrderClaimServiceImplTest,CpsRebateRecordServiceImplTest,CpsRebateSettleServiceImplTest,CpsRebateSettleMultiLevelTest,CpsMoneyConverterTest,CpsRebateAssetServiceImplTest,CpsRebateAssetLedgerConcurrencyTest,CpsRebateTokenExchangeServiceImplTest,CpsWithdrawSecurityServiceTest,CpsWithdrawAccountServiceTest,CpsMcpAuthorizationServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload safety test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenticcps-safety-test-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Package qiji-server
        run: mvn -B -ntp -f backend/pom.xml clean package -pl qiji-server -am -DskipTests
      - name: Upload Java build
        uses: actions/upload-artifact@v4
        with:
          name: agenticcps-java-server
          path: backend/qiji-server/target/qiji-server.jar
          if-no-files-found: error
          retention-days: 7

  admin:
    name: Build Vue admin (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
          run_install: false
      - name: Install dependencies
        working-directory: frontend/admin-vue3
        run: pnpm install --frozen-lockfile
      - name: Build admin for Docker
        working-directory: frontend/admin-vue3
        run: pnpm build:docker
      - name: Upload Vue build
        uses: actions/upload-artifact@v4
        with:
          name: agenticcps-admin-vue3
          path: frontend/admin-vue3/dist-prod/
          if-no-files-found: error
          retention-days: 7
