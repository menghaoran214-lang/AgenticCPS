name: CPS Migration Preflight Regression (isolated)
on:
  push:
    branches: [develop]
    paths:
      - script/ci/cps_cloud_readonly_preflight.py
      - script/ci/test_cloud_readonly_preflight.py
      - .github/workflows/cps-migration-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-github-runner-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-github-runner-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      GITHUB_ACTIONS: "true"
      CPS_FULL_BASELINE_CI: "1"
      CPS_37_SCHEMA_ISOLATED: "1"
      MYSQL_HOST: "127.0.0.1"
      MYSQL_ROOT_PASSWORD: local-github-runner-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyMySQL==1.1.2" "PyYAML==6.0.2"
      - name: Check read-only preflight boundaries without connecting to Tencent
        run: python -m unittest discover -s script/ci -p test_cloud_readonly_preflight.py -v
      - name: Validate production authentication source configuration
        run: python script/ci/cps_production_auth_guard.py
      - name: Rebuild canonical 121-table baseline and 67 module tables with V06
        run: python script/ci/cps_full_baseline_integration.py
      - name: Check actual promotion and payment entities and duplicate business keys
        run: python script/ci/cps_promotion_pay_schema_probe.py
      - name: Preserve isolated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-migration-preflight
          path: |
            full-baseline-migration-ci-report.json
            promotion-pay-schema-report.json
            production-auth-config-report.json
          retention-days: 7
