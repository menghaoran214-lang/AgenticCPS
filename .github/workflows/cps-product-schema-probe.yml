name: CPS Product MySQL 8 Migration Probe (isolated)

on:
  push:
    branches: [develop]
    paths:
      - backend/sql/migrations/V20261028_02__product_core_mysql8.sql
      - script/ci/cps_product_schema_probe.py
      - .github/workflows/cps-product-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-mysql-not-live
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-mysql-not-live"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GITHUB_ACTIONS: "true"
      CPS_PRODUCT_SCHEMA_ISOLATED: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_ROOT_PASSWORD: isolated-ci-mysql-not-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test connector
        run: python -m pip install "PyMySQL==1.1.2"
      - name: Validate all nine product model tables
        run: python script/ci/cps_product_schema_probe.py
      - name: Store non-production schema test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-product-mysql8-schema-check
          path: product-schema-ci-report.json
          retention-days: 7
          if-no-files-found: warn
