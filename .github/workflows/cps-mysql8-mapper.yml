name: CPS Real MySQL8 Mapper Consistency (isolated)
on:
  push:
    branches: [develop]
    paths:
      - backend/qiji-module-pay/**
      - backend/qiji-module-member/**
      - backend/qiji-module-cps/qiji-module-cps-biz/src/test/java/com/qiji/cps/module/cps/integration/**
      - backend/sql/module/member-*.sql
      - .github/workflows/cps-mysql8-mapper.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-mappers:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mapper-ci-only
          MYSQL_DATABASE: cps_mapper_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmapper-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=18
    env:
      CPS_MYSQL8_INTEGRATION: '1'
      MAVEN_OPTS: '-Xmx3g -XX:MaxMetaspaceSize=768m'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prove baseline fails the wallet and member lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          baseline=34840e49bef1d78e7496f41959eeeee7baf95ea0
          files=(
            backend/qiji-module-pay/src/main/java/com/qiji/cps/module/pay/dal/mysql/wallet/PayWalletTransactionMapper.java
            backend/qiji-module-pay/src/main/java/com/qiji/cps/module/pay/service/wallet/PayWalletTransactionService.java
            backend/qiji-module-pay/src/main/java/com/qiji/cps/module/pay/service/wallet/PayWalletTransactionServiceImpl.java
            backend/qiji-module-pay/src/main/java/com/qiji/cps/module/pay/service/wallet/PayWalletServiceImpl.java
            backend/qiji-module-pay/src/main/java/com/qiji/cps/module/pay/framework/pay/core/client/impl/wallet/WalletPayClient.java
          )
          for file in "${files[@]}"; do git show "$baseline:$file" > "$file"; done
          set +e
          CPS_MYSQL8_BASELINE=1 mvn -B -ntp -f backend/pom.xml test -pl qiji-module-cps/qiji-module-cps-biz -am -Dtest=CpsMysql8ConsistencyTest -Dsurefire.failIfNoSpecifiedTests=false > baseline-mysql8.log 2>&1
          result=$?
          set -e
          git restore --source=HEAD -- "${files[@]}"
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('backend/qiji-module-cps/qiji-module-cps-biz/target/surefire-reports/TEST-com.qiji.cps.module.cps.integration.CpsMysql8ConsistencyTest.xml')
          root=ET.parse(p).getroot()
          failed={x.attrib['name'] for x in root.findall('testcase') if x.find('failure') is not None or x.find('error') is not None}
          required={'walletBusinessLookupMatchesWalletAndTenantUniqueKey','repeatedDeleteAndReregisterKeepsAllHistoryAndOnlyOneActiveMobile'}
          assert required == failed, failed
          for case in root.findall('testcase'):
              if case.attrib['name'] in required:
                  detail=ET.tostring(case, encoding='unicode')
                  expected='TooManyResultsException' if case.attrib['name'].startswith('wallet') else 'DuplicateKeyException'
                  assert expected in detail, detail
          print('Baseline reproduced both targeted failures:', sorted(failed))
          PY
          mkdir -p mysql8-evidence/baseline
          cp backend/qiji-module-cps/qiji-module-cps-biz/target/surefire-reports/*CpsMysql8ConsistencyTest* mysql8-evidence/baseline/
      - name: Recreate only disposable CI database
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pmapper-ci-only -e 'DROP DATABASE cps_mapper_ci; CREATE DATABASE cps_mapper_ci CHARACTER SET utf8mb4;'
      - name: Run fixed real MySQL mapper and payment lookup regressions
        run: >-
          mvn -B -ntp -f backend/pom.xml test
          -pl qiji-module-cps/qiji-module-cps-biz -am
          -Dtest=CpsMysql8ConsistencyTest,CpsWalletLookupSafetyTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require actual passing executions without skipped tests
        run: python3 script/ci/verify_safety_reports.py backend CpsMysql8ConsistencyTest,CpsWalletLookupSafetyTest
      - name: Verify restore environment boundaries
        run: python3 -m unittest discover -s script/ci -p test_mysql8_synthetic_restore.py -v
      - name: Rehearse synthetic backup restore without production archives
        run: python3 script/ci/cps_mysql8_synthetic_restore.py
      - name: Upload baseline and fixed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps-real-mysql8-mapper-reports
          path: |
            mysql8-evidence/
            mysql8-synthetic-restore-report.json
            baseline-mysql8.log
            backend/**/target/surefire-reports/
          retention-days: 7
