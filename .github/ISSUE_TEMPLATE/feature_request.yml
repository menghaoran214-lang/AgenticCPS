name: 功能建议
description: 建议一项通用功能或体验改进；已有明确交付、预算和排期的需求请使用“功能悬赏”
title: "[功能建议]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 AgenticCPS。请先描述要解决的问题，再说明建议方案。
        请勿在 Issue 中填写密钥、Token、账号密码或敏感业务数据。

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - AI 购物与智能推荐
        - 商品搜索、比价与转链
        - 电商或本地生活平台接入
        - 订单、返利与结算
        - App、小程序或行业模板
        - 运营管理后台
        - MCP 与开放接口
        - 部署、文档与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户、场景、现状和影响，避免只写功能名称。
      placeholder: "当 ... 时，用户目前无法/很难 ...，这会导致 ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、接口或业务流程；不确定实现方式时可以只写期望结果。
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: 典型使用场景
      placeholder: |
        1. 用户 ...
        2. 系统 ...
        3. 用户得到 ...
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      description: 哪些可观察结果可以说明该建议已经实现？
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 如果目前有临时做法或参考产品，请在此说明。
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 愿意提交 Pull Request
        - 可以协助测试或补充资料
        - 暂时无法参与实现
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的功能建议。
          required: true
        - label: 我已移除密钥、账号和敏感业务数据。
          required: true
